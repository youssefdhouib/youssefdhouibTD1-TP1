@if (tasks().length === 0) {
  <app-empty-state message="Aucune tâche." />
} @else {
  <ul class="space-y-4">
    <!-- track conserve l'identité de chaque tâche grâce à son id. -->
    @for (task of tasks(); track task.id) {
      <li>
        <!-- Le parent transmet les données à son composant enfant. -->
        <app-task-item
          [task]="task"
          [showAssignee]="showAssignee()"
          [assigneeName]="assigneeName(task.assigneeId)"
          (taskStatusChange)="taskStatusChange.emit({ taskId: task.id, status: $event })"
        />
      </li>
    }
  </ul>
}
