<main class="min-h-screen bg-slate-100 px-4 py-8 sm:px-8 sm:py-12">
  <div class="mx-auto max-w-7xl">
    <header class="mb-10 flex flex-wrap items-end justify-between gap-6">
      <div>
        <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-blue-700">Tableau de travail</p>
        <h1 class="text-3xl font-bold tracking-tight text-slate-950 sm:text-4xl">TaskFlow</h1>
        <p class="mt-3 text-slate-600">Vos projets, vos tâches et votre équipe au même endroit.</p>
      </div>
      <app-view-toggle
        [activeView]="activeView()"
        (viewChange)="activeView.set($event)"
      />
    </header>

    @if (activeView() === 'tasks') {
      <app-project-list />
    } @else {
      <app-user-list />
    }

    <!-- Exemples supplémentaires : paramètres optionnels d'un pipe et d'une directive. -->
    <section class="mt-8 rounded-xl bg-white p-6 shadow-sm" aria-labelledby="examples-title">
      <h2 id="examples-title" class="mb-3 text-lg font-semibold text-slate-900">
        Exemples simples : pipe et directive
      </h2>
      <!-- Sans facteur : 5 × 2. Sans couleur : rouge par défaut. -->
      <p appColor>5 × 2 = {{ 5 | multiply }}</p>
      <!-- Avec facteur 3 et couleur choisie. -->
      <p appColor="blue" class="mt-2">5 × 3 = {{ 5 | multiply: 3 }}</p>
    </section>
  </div>
</main>
