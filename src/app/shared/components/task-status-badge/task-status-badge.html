<span class="inline-block rounded-full px-2 py-1 text-xs font-semibold"
      [ngClass]="{
        'bg-amber-100 text-amber-900': status() === 'En attente',
        'bg-blue-100 text-blue-900': status() === 'En cours',
        'bg-emerald-100 text-emerald-800': status() === 'Terminé'
      }">
  {{ status() }}
</span>
